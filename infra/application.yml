server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - IOS
      - ANDROID_MUSIC
      - ANDROID_VR
      - MWEB
      - WEBEMBEDDED
      - WEB
    # OAuth2 — on first boot Lavalink prints a device-code URL in the console.
    # Sign in with a burner Google account, then set YOUTUBE_OAUTH_REFRESH_TOKEN in .env.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: false

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:-youshallnotpass}"
    sources:
      youtube: false   # Disabled — handled by the youtube-plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:e41dd95f8bd134b51e75080fb28cc805fecb431a"
      snapshot: true
      repository: "https://maven.lavalink.dev/snapshots"

logging:
  file:
    max-history: 7
    max-size: 25MB
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: DEBUG
